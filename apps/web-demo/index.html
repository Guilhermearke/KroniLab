<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KroniLab — Studio</title>
<meta name="theme-color" content="#05070B">
<meta name="description" content="KroniLab: VS com stems, click, guia, saltos quantizados, loop, nudge e tap tempo.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎛️</text></svg>">
<link rel="stylesheet" href="./styles.css">
</head>
<body>

<!-- ------------------------------------------------------------------ -->
<!-- Topo: identidade da musica + acao de palco                          -->
<!-- ------------------------------------------------------------------ -->
<header class="topbar">
  <button class="icon-btn" id="view-toggle" title="Mixer">▥</button>
  <div class="topbar-title">
    <h1 id="song-title">—</h1>
    <div class="topbar-meta">
      <span class="meta-item"><i>♪</i><b id="meta-key">C</b></span>
      <span class="meta-item"><i>𝄞</i><b id="meta-bpm">115</b> BPM</span>
      <span class="meta-item"><i>◷</i><b id="meta-dur">0:00</b></span>
    </div>
  </div>
  <button class="icon-btn save" title="Salvar">▤</button>
  <button class="live-btn" id="live-btn"><span class="dot"></span> Ao Vivo</button>
  <button class="icon-btn" id="next-song" title="Proxima musica">⋮</button>
</header>

<!-- ------------------------------------------------------------------ -->
<!-- Studio: regua, cifras e lanes                                        -->
<!-- ------------------------------------------------------------------ -->
<!-- Tira de setlist: a musica atual e as proximas, com o tom de cada uma -->
<nav class="setlist" id="setlist"></nav>

<!-- Waveform-resumo da musica inteira, com marcadores de secao -->
<div class="summary">
  <canvas id="summary"></canvas>
  <div class="markers" id="markers"></div>
  <div class="summary-cursor" id="summary-cursor"></div>
</div>

<main id="studio" class="view">
  <div id="timeline"></div>
  <div class="tl-controls">
    <button class="icon-btn small" id="zoom-out">−</button>
    <button class="icon-btn small" id="zoom-in">+</button>
  </div>
</main>

<!-- ------------------------------------------------------------------ -->
<!-- Mixer                                                                -->
<!-- ------------------------------------------------------------------ -->
<main id="mixer-view" class="view is-hidden">
  <div class="mx-toolbar">
    <span class="mx-select"><i>♪</i> <b id="sel-key">C</b> <span class="chev">⌄</span></span>
    <span class="mx-select"><i>𝄞</i> <b id="sel-bpm">115</b> BPM <span class="chev">⌄</span></span>
    <span class="mx-select on"><i>123</i> <b id="sel-countin">2 comp.</b> <span class="chev">⌄</span></span>
  </div>
  <div id="mixer"></div>
</main>

<!-- ------------------------------------------------------------------ -->
<!-- Live Mode: tela de palco, sem nada que se toque por engano           -->
<!-- ------------------------------------------------------------------ -->
<div id="live" class="live is-hidden">
  <div class="live-head">
    <div>
      <h2 id="live-title">—</h2>
      <p id="live-meta"></p>
    </div>
    <div class="live-bar">
      <span id="live-position">0.0</span>
      <small id="live-rate"></small>
    </div>
  </div>
  <div class="live-sections" id="live-sections"></div>
  <div class="live-state">
    <div><span>ATUAL</span><strong id="live-current">—</strong></div>
    <div><span>PRÓXIMO</span><strong id="live-next">—</strong></div>
  </div>
  <div class="live-controls">
    <button class="lv-btn" id="lv-quantize">SALTO: COMPASSO</button>
    <button class="lv-btn" id="lv-cancel">CANCELAR FILA</button>
    <button class="lv-btn" id="lv-nudge-down">NUDGE −</button>
    <button class="lv-btn" id="lv-nudge-up">NUDGE +</button>
    <button class="lv-btn" id="lv-tap">TAP</button>
    <button class="lv-btn" id="lv-exit">SAIR</button>
  </div>
  <div class="log" id="log"></div>
</div>

<!-- ------------------------------------------------------------------ -->
<!-- Transporte: comum a todas as telas                                   -->
<!-- ------------------------------------------------------------------ -->
<footer class="transport">
  <div class="tr-seek">
    <span class="tr-time" id="tr-current">0:00</span>
    <input type="range" id="tr-slider" min="0" max="1000" value="0">
    <span class="tr-total" id="tr-total">0:00</span>
  </div>
  <div class="tr-buttons">
    <button class="tr-ico" id="tr-list" title="Setlist">☰</button>
    <button class="tr-ico" id="tr-chart" title="Cifra">♫</button>
    <button class="tr-ico" id="tr-start" title="Inicio">|◀</button>
    <button class="tr-ico" id="tr-back" title="Voltar 1 compasso">◀◀</button>
    <button class="tr-play" id="tr-play" title="Tocar">▶</button>
    <button class="tr-ico" id="tr-fwd" title="Avancar 1 compasso">▶▶</button>
    <button class="tr-ico" id="tr-end" title="Fim">▶|</button>
    <button class="tr-ico" id="tr-loop" title="Loop da secao">⟲</button>
    <button class="tr-ico on" id="tr-follow" title="Seguir playhead">⇥</button>
  </div>
</footer>

<script type="module" src="./app.js"></script>
</body>
</html>
